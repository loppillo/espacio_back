# -----------------------------------------------------------
# Ruta del archivo: .github/workflows/ci.yml
# Workflow: CI - espacio_back
#
# Objetivo:
#   - Ejecutar validaciones automáticas cada vez que se hace push
#     o pull request contra la rama main.
#   - Validar:
#       1. Instalación correcta de dependencias
#       2. Compilación correcta del proyecto NestJS
#
# Este workflow es el que habilita el pipeline profesional:
#   - Si CI falla => NO hay Deploy
#   - Si CI pasa  => Ejecuta Deploy - espacio_back
# -----------------------------------------------------------
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: CI - espacio_back

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Descarga el código del repositorio
      - name: Checkout código
        uses: actions/checkout@v4

       # 2. Usa Node.js versión 18 (igual que en el VPS)
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'   # o '18.x' si prefieres rango
          cache: 'npm'

      # 3. Instala dependencias de forma limpia (npm ci)
      - name: Instalar dependencias
        run: npm ci

      # 4. Ejecuta el build del backend NestJS
      - name: Compilar proyecto NestJS
        run: npm run build
